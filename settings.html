<div class="pv-settings">
  <p class="pv-settings-desc">
    플러그인 허브에 통합 표시할 플러그인과 보관함(세션)을 선택하세요.
    체크하면 아래 세션별 레인에 칩이 추가되며, 칩을 드래그해 탭 순서를 바꾸거나 다른 세션으로 옮길 수 있습니다.
    하나라도 켜면 해당 플러그인의 개별 사이드바 탭은 자동으로 숨겨집니다 (전부 끄면 원복).
    정지된 플러그인은 목록에 계속 표시되며 선택 값은 그대로 보존됩니다 — 체크박스만 잠겨서(변경 불가)
    다시 활성화하면 예전 선택이 자동으로 복원됩니다. 정지 중에는 탭에도 나타나지 않습니다.
  </p>
  <div class="pv-grid" data-pv-role="grid">
    <div class="pv-settings-empty">플러그인 목록을 불러오는 중...</div>
  </div>
  <div class="pv-lanes-wrap">
    <h4 class="pv-lanes-heading">세션별 탭 순서</h4>
    <div class="pv-lanes" data-pv-role="lanes"></div>
  </div>
</div>
