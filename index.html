<div class="uf-plugin" data-uf-root>
  <div class="uf-topbar">
    <div class="uf-topbar-title">
      <i class="fa-solid fa-object-group uf-header-icon"></i>
      <span class="uf-header-title">플러그인 허브</span>
    </div>
    <div class="uf-nav-group">
      <button type="button" class="btn-scan-activity" data-role="scan-activity-mirror" title="스캔 활동" aria-label="스캔 활동">
        <i class="fa-solid fa-wave-square" aria-hidden="true"></i>
        <span class="scan-activity-indicator" aria-hidden="true"></span>
      </button>
      <nav class="bo-viewer-library-nav" data-role="library-navigation" aria-label="보관함 이동">
        <button type="button" data-library-destination="general">일반 도서</button>
        <button type="button" data-library-destination="adult">성인 도서</button>
        <button type="button" data-library-destination="audiobook">오디오북</button>
        <button type="button" data-library-destination="video">영상 강좌</button>
      </nav>
    </div>
  </div>
  <div class="uf-tabsbar" data-role="tabsbar">
    <div class="uf-tabs" data-role="tabs"></div>
    <button type="button" class="uf-settings-btn" data-role="open-settings" title="플러그인 허브 설정 열기">
      <i class="fa-solid fa-gear"></i>
    </button>
  </div>
  <div class="uf-panes" data-role="panes">
    <div class="uf-status" data-role="status" aria-live="polite">뷰어 목록을 불러오는 중...</div>
  </div>
</div>
